services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: bookmark-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Tew0945}
      POSTGRES_DB: ${DB_NAME:-bookmarks_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmark-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
      - "5555:5555"
    environment:
      - PORT=5001
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-bookmarks_db}
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-Tew0945}
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-Tew0945}@db:5432/${DB_NAME:-bookmarks_db}?schema=public
      - CLIENT_ORIGIN=http://localhost:5173
      - JWT_SECRET=${JWT_SECRET:-your_super_secret_key_here}
    networks:
      - app-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookmark-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - app-network

  # ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: bookmark-ml-service
    restart: always
    ports:
      - "5000:5000"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
